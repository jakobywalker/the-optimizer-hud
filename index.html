<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Optimizer HUD</title>
<style>
:root{
  --bg:#02070b;
  --panel:#06131b;
  --panel2:#081a24;
  --line:#0d7dad;
  --line-soft:#164a62;
  --cyan:#59caff;
  --cyan2:#1faee8;
  --text:#e8f7ff;
  --muted:#9db7c5;
  --green:#4ade80;
  --yellow:#facc15;
  --orange:#fb923c;
  --red:#ff5d57;
  --purple:#b66cff;
  --shadow:0 0 18px rgba(41,190,255,.08);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -20%,#092333 0,#02070b 38%,#010407 100%);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}
body{overflow-x:hidden;position:relative}
body::before{content:"";position:fixed;inset:-12%;z-index:0;pointer-events:none;background:
  radial-gradient(circle at 18% 12%,rgba(0,180,255,.075),transparent 24%),
  radial-gradient(circle at 82% 72%,rgba(182,108,255,.05),transparent 27%),
  linear-gradient(rgba(63,202,247,.022) 1px,transparent 1px),
  linear-gradient(90deg,rgba(63,202,247,.018) 1px,transparent 1px);
  background-size:auto,auto,74px 74px,74px 74px;opacity:.9;animation:ambientDrift 28s ease-in-out infinite alternate}
body::after{content:"";position:fixed;inset:0;z-index:999;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0,rgba(255,255,255,.018) 1px,transparent 1px,transparent 4px);mix-blend-mode:screen;opacity:.42;animation:scanlineDrift 18s linear infinite}
.app{position:relative;z-index:1}
button,input,textarea,select{font:inherit}
button{color:inherit}
.app{max-width:1800px;margin:auto;padding:14px 18px 18px}
.topbar{display:grid;grid-template-columns:minmax(300px,1.2fr) minmax(520px,1.7fr) 170px;gap:18px;align-items:center;border-bottom:1px solid var(--line);padding:0 8px 12px;margin-bottom:10px;position:relative}
.topbar:after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.35;transform-origin:center;animation:topbarSignal 8s ease-in-out infinite}
.brand h1{margin:0;font-size:clamp(26px,2.4vw,46px);line-height:.95;letter-spacing:1.5px;font-weight:900;text-transform:uppercase;text-shadow:0 0 20px rgba(89,202,255,.15)}
.brand p{margin:7px 0 0;color:var(--cyan);font-size:14px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase}
.clock{text-align:right;color:#8fd8ff;font-weight:700;line-height:1.45;letter-spacing:.5px;text-shadow:0 0 12px rgba(89,202,255,.12)}.system-status{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-top:4px;font-size:9px;color:#78dca0;letter-spacing:1.2px;text-transform:uppercase}.system-status i{width:6px;height:6px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px rgba(74,222,128,.8);animation:statusPulse 2.8s ease-in-out infinite}
.meters{border:1px solid #233641;border-radius:8px;padding:11px 14px;background:rgba(2,8,12,.5);box-shadow:var(--shadow)}
.meter-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.metric-name{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:800;margin-bottom:7px;text-transform:uppercase}.metric-value{color:var(--cyan);font-size:13px}
.bar{height:11px;border-radius:3px;background:#14242c;overflow:hidden;box-shadow:inset 0 0 5px #000}.bar>i{height:100%;display:block;background:linear-gradient(90deg,#22c55e,#84cc16);box-shadow:0 0 12px rgba(74,222,128,.35);position:relative;overflow:hidden}
.metric:nth-child(2) .bar>i{background:linear-gradient(90deg,#0ea5e9,#38bdf8)}
.metric:nth-child(3) .bar>i{background:linear-gradient(90deg,#9333ea,#c084fc)}
.metric:nth-child(4) .bar>i{background:linear-gradient(90deg,#f59e0b,#fb923c)}
.player-card{display:grid;grid-template-columns:minmax(300px,1.1fr) minmax(180px,.65fr) 1fr;gap:10px;margin-bottom:10px;position:relative;z-index:10}
.player-id,.level-box,.quick-actions{border:1px solid var(--line);background:rgba(4,16,23,.9);min-height:58px;padding:9px 14px;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);box-shadow:var(--shadow)}
.player-id{display:flex;align-items:center;gap:13px}.avatar{width:38px;height:38px;border:1px solid #69d3ff;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#69d3ff;background:#0a1c26;box-shadow:0 0 0 rgba(89,202,255,0);animation:avatarIdle 5.5s ease-in-out infinite}.player-id b{display:block;font-size:18px}.player-id span{font-size:11px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
.level-box{display:grid;align-content:center}.level-line{display:flex;justify-content:space-between;font-size:12px;color:#bfe9ff;font-weight:700}.xp{margin-top:8px;height:7px;background:#182b36;overflow:hidden}.xp i{display:block;height:100%;background:#27bdf5;width:57%;position:relative;overflow:hidden}
.quick-actions{display:flex;justify-content:flex-end;align-items:center;gap:8px;clip-path:none;overflow:visible;position:relative;z-index:25}.motion-indicator{border-color:#7652a8!important;background:#23143a!important;color:#decfff!important;box-shadow:0 0 12px rgba(182,108,255,.12)}.btn{border:1px solid #27657f;background:#0a1c26;padding:8px 12px;border-radius:5px;cursor:pointer;font-size:12px;font-weight:700;letter-spacing:.3px;transition:.16s}.btn:hover{border-color:var(--cyan);transform:translateY(-1px);box-shadow:0 0 12px rgba(89,202,255,.12)}.btn.primary{background:#0f4d69;border-color:#27bdf5}.btn.danger{border-color:#8c3030;background:#321313}.btn.ghost{background:transparent}
.dashboard{display:grid;grid-template-columns:minmax(280px,.96fr) minmax(560px,1.55fr) minmax(330px,.9fr);gap:10px}
.column{display:flex;flex-direction:column;gap:10px}
.panel{border:1px solid var(--line);background:linear-gradient(155deg,rgba(7,24,33,.96),rgba(3,12,17,.96));box-shadow:var(--shadow);border-radius:7px;overflow:hidden;position:relative;transition:border-color .28s ease,box-shadow .28s ease,transform .28s ease}.panel:hover{border-color:#2198c5;box-shadow:0 0 24px rgba(41,190,255,.105);transform:translateY(-1px)}
.panel:before{content:"";position:absolute;top:0;left:0;width:72px;height:1px;background:var(--cyan);box-shadow:0 0 7px rgba(89,202,255,.5);animation:cornerSignal 6.5s ease-in-out infinite}.panel:after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(108deg,transparent 0 44%,rgba(89,202,255,.055) 49%,transparent 54%);transform:translateX(-145%);animation:panelSweep 17s cubic-bezier(.45,0,.55,1) infinite}.left-col .panel:nth-child(2):after{animation-delay:-5s}.left-col .panel:nth-child(3):after{animation-delay:-11s}.middle-col .panel:nth-child(1):after{animation-delay:-8s}.middle-col .panel:nth-child(2):after{animation-delay:-14s}.right-col .panel:nth-child(1):after{animation-delay:-3s}.right-col .panel:nth-child(2):after{animation-delay:-12s}.panel>*{position:relative;z-index:2}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:9px 11px;border-bottom:1px solid #13394d;background:rgba(3,12,17,.55)}
.panel-title{display:flex;align-items:center;gap:8px;color:var(--cyan);font-size:15px;letter-spacing:.8px;text-transform:uppercase;font-weight:900;text-shadow:0 0 10px rgba(89,202,255,.09)}.num{width:23px;height:23px;border-radius:50%;display:grid;place-items:center;background:#54bdf1;color:#041018;font-weight:900;font-size:13px;box-shadow:0 0 0 rgba(89,202,255,0);animation:numIdle 6s ease-in-out infinite}.panel-tools{display:flex;gap:5px}.icon-btn{border:1px solid transparent;background:transparent;color:#7fcff3;cursor:pointer;padding:2px 5px;border-radius:4px}.icon-btn:hover{border-color:#285d75;background:#0a1c26}
.panel-body{padding:10px 12px}.small{font-size:11px;color:var(--muted)}
.stat-row{display:grid;grid-template-columns:27px minmax(120px,1fr) minmax(90px,1.1fr) 45px;gap:8px;align-items:center;padding:5px 0}.stat-row .ico{color:#31d7e8;text-align:center}.stat-row label{font-size:11px;color:#c0d4de;text-transform:uppercase}.stat-row output{text-align:right;font-size:13px;font-weight:800;color:var(--cyan)}
.progress{height:10px;background:#152731;overflow:hidden;border-radius:2px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#22d3ee,#38bdf8);width:50%;transition:width .25s;position:relative;overflow:hidden}.progress i:after,.xp i:after,.bar>i:after{content:"";position:absolute;inset:-30% auto -30% -45%;width:32%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.42),transparent);transform:skewX(-18deg);animation:barSignal 5.8s ease-in-out infinite}.stat-row.warn .progress i{background:linear-gradient(90deg,#f59e0b,#fbbf24)}.stat-row.low .progress i{background:linear-gradient(90deg,#ef4444,#fb7185)}
.bottleneck{border-color:#8f2b2b;background:linear-gradient(145deg,rgba(43,10,10,.62),rgba(8,10,13,.96))}.alert-head{display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid #522020;padding-bottom:8px;margin-bottom:8px}.alert-icon{font-size:24px;color:var(--red)}.alert-head b{color:#ff756e;font-size:13px}.debuff-row{display:grid;grid-template-columns:18px 1fr auto;gap:6px;padding:4px 0;font-size:11px}.debuff-row span:last-child{color:#ff716a}
.resource-row{display:grid;grid-template-columns:22px 1fr 105px 45px;gap:7px;align-items:center;padding:4px 0;font-size:11px}.resource-row b{color:#aee7ff;font-size:12px;text-align:right}.resource-row.money{grid-template-columns:22px 1fr auto}.resource-row.money b{color:#6fe3ff}
.money-system{margin-top:8px;border:1px solid #17465c;border-radius:6px;background:linear-gradient(155deg,rgba(4,22,31,.96),rgba(2,10,15,.96));overflow:hidden}
.money-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:9px 10px 7px;border-bottom:1px solid #123b4d}.money-label{font-size:10px;color:#8ddcff;font-weight:900;letter-spacing:1px;text-transform:uppercase}.money-balance{font-size:23px;font-weight:900;color:#e9faff;letter-spacing:.3px;text-shadow:0 0 14px rgba(89,202,255,.16)}.money-net{text-align:right;font-size:10px;color:#96adba}.money-net b{display:block;margin-top:2px;font-size:13px}.money-net .positive,.money-entry .positive{color:#62e58c}.money-net .negative,.money-entry .negative{color:#ff746f}.money-range{display:flex;gap:4px;padding:6px 9px 0}.money-range button{border:1px solid #24556b;background:#071922;color:#8fcde9;border-radius:4px;padding:3px 7px;font-size:9px;font-weight:900;cursor:pointer}.money-range button.active{border-color:#44c7ff;background:#0e4259;color:#dff7ff}.money-chart-wrap{height:116px;padding:4px 7px 0;position:relative}.money-chart{display:block;width:100%;height:100%;overflow:visible}.money-chart .grid{stroke:#143747;stroke-width:1}.money-chart .axis-label{fill:#6f96a8;font-size:9px}.money-chart .area{fill:url(#moneyAreaGradient)}.money-chart .line{fill:none;stroke:#52d1ff;stroke-width:3;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 4px rgba(82,209,255,.38));stroke-dasharray:1800;stroke-dashoffset:1800;animation:chartDraw 1.15s cubic-bezier(.22,.75,.22,1) forwards,chartSignal 7s ease-in-out 1.15s infinite}.money-chart .area{animation:chartAreaIn .8s ease-out both}.money-chart .point{animation:pointIn .38s ease-out both}.money-chart .point{fill:#06151d;stroke:#81e0ff;stroke-width:2;vector-effect:non-scaling-stroke}.money-chart-empty{height:100%;display:grid;place-items:center;color:#6f96a8;font-size:10px;text-transform:uppercase;letter-spacing:.8px}.money-controls{display:grid;grid-template-columns:minmax(74px,.75fr) minmax(100px,1.2fr) auto auto;gap:5px;padding:7px 8px}.money-controls input{min-width:0;border:1px solid #225269;background:#04131b;color:#e5f7ff;border-radius:4px;padding:7px 8px;font-size:10px;outline:none}.money-controls input:focus{border-color:#45caff}.money-controls button,.money-tools button{border:1px solid #2b6177;background:#09202b;color:#bfeeff;border-radius:4px;padding:6px 7px;font-size:9px;font-weight:900;cursor:pointer}.money-controls .income{border-color:#277343;background:#0a2e1a;color:#80f1a4}.money-controls .expense{border-color:#813433;background:#351313;color:#ff918d}.money-tools{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:0 8px 7px}.money-tools .set{border-color:#755e1b;background:#2c2508;color:#ffe47b}.money-tools .undo{margin-left:auto}.money-history{border-top:1px solid #123949;padding:5px 8px 7px}.money-entry{display:grid;grid-template-columns:1fr auto;gap:8px;padding:3px 0;font-size:9px;color:#9fb8c4}.money-entry span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.money-entry small{color:#607f8e;margin-left:4px}.money-entry b{font-size:10px;text-align:right}.money-empty{font-size:9px;color:#668390;padding:4px 0}
.main-quest .panel-body{padding:18px 26px}.quest-title{text-align:center;font-weight:900;font-size:17px;text-transform:uppercase;margin-bottom:17px}.big-progress{display:grid;grid-template-columns:1fr 48px;gap:12px;align-items:center;margin-bottom:20px}.big-progress .progress{height:12px}.big-progress .progress i{background:linear-gradient(90deg,#2fbff7,#6bd3ff)}.big-progress strong{font-size:19px}
.stages{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;position:relative;margin:8px 0 20px}.stages:before{content:"";position:absolute;top:18px;left:5%;right:5%;height:1px;background:#48616d}.stage{position:relative;text-align:center;z-index:1;cursor:pointer;user-select:none}.stage-dot{width:32px;height:32px;border:2px solid #67808b;border-radius:50%;margin:0 auto 7px;display:grid;place-items:center;background:#071018;color:#9fb1ba;font-size:13px;transition:.2s}.stage.done .stage-dot{border-color:#5de28a;background:#154d2e;color:white}.stage.active .stage-dot{border-color:var(--yellow);box-shadow:0 0 12px rgba(250,204,21,.15);color:var(--yellow)}.stage-name{font-size:9px;text-transform:uppercase;color:#c3d2d9;line-height:1.1}.stage-pct{font-size:12px;font-weight:800;color:#b9ced8;margin-top:4px}.stage.done .stage-name,.stage.done .stage-pct{color:#6ef294}.stage.active .stage-name,.stage.active .stage-pct{color:var(--yellow)}
